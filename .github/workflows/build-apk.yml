name: Build ADAS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17 voi Gradle cache
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set Android SDK local properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Tao Gradle Wrapper 8.5
      run: gradle wrapper --gradle-version=8.5 --distribution-type=bin

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (co retry khi bi 429)
      run: |
        for i in 1 2 3; do
          echo "=== Lan thu $i ==="
          ./gradlew assembleDebug --no-daemon --build-cache --stacktrace && break
          echo "Loi lan $i, cho 30 giay roi thu lai..."
          sleep 30
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ADAS_LPHLinh_v1.1
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 7